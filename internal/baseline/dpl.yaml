# The layers of the baseline architecture. The rules see this file as data.dpl.
layer_order: [manager, engine, accessor, resource]

# The layers that a service in each layer can call.
layers:
  manager: [engine, accessor]
  engine: [accessor]
  accessor: [resource]
  resource: []

# The suffix that the name of a service in each layer must have.
suffix:
  manager: Manager
  engine: Engine
  accessor: Accessor
  resource: Resource
