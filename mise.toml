[tools]
go = "1.26.9"
golangci-lint = "2.14.0"
opa = "1.21.2" # Keep in step with github.com/open-policy-agent/opa in go.mod.
regal = "0.43.0"

[tasks.build]
description = "Build bin/sv"
run = "go build -trimpath -ldflags '-s -w' -o bin/sv ./cmd/sv"

[tasks.test]
description = "Run all tests"
run = [
  "go test ./...",
  # The Rego tests of the project rules in .specval. They use lib.rego.
  "opa test .specval/policy internal/baseline/policy/lib.rego",
]

[tasks.cover]
description = "Run all tests and open the coverage report"
run = [
  "go test -coverprofile=coverage.out ./...",
  "go tool cover -html=coverage.out",
]

[tasks.lint]
description = "Check Go and Rego code"
run = [
  "golangci-lint run ./...",
  "opa fmt --list --fail internal examples .specval",
  "regal lint internal examples .specval",
]

[tasks.fmt]
description = "Format Go and Rego code"
run = [
  "golangci-lint fmt ./...",
  "opa fmt --write internal examples .specval",
]

[tasks.vuln]
description = "Find known vulnerabilities in the code and its dependencies"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./..."

[tasks.specs]
description = "Check the specs of specval with specval (dogfooding)"
run = "go run ./cmd/sv check --strict"

[tasks.check]
description = "Run lint, test, and check the specs (do this before you push)"
depends = ["lint", "test", "specs"]
