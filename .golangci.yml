version: "2"

linters:
  default: standard
  enable:
    - dupword
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - godot
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - nolintlint
    - perfsprint
    - predeclared
    - revive
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, style, performance]
    gosec:
      excludes:
        - G301 # specval creates project directories that other tools must read (0o755).
        - G304 # specval reads files at paths that the user gives it.
        - G703 # Same as G304, found by taint analysis.
        - G306 # specval writes project files that other tools must read (0o644).
        - G302 # Same as G306, for a file that specval creates with os.OpenFile.
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tarrball/specval
