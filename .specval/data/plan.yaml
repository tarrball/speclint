# The data of the project rules in .specval/policy/plan.rego.

# The limits for one spec. A spec over a limit is a change that is too large
# for one pull request.
plan:
  max_calls: 8
  max_acceptance: 5

# ASD-STE100 (see docs/style.md). Each word maps to the fix for it.
ste:
  max_words: 25
  # An acceptance criterion is one Given/when/then sentence, so it can be longer.
  max_words_acceptance: 40
  words:
    should: Use "must" for a requirement, or "can" for a possibility.
    etc.: Write each item of the list.
    appropriate: Tell the condition or the value.
    quickly: Give the time as a number.
    user-friendly: Tell what the user can do.
    simply: Remove the word.
    just: Remove the word.
    easily: Remove the word.
    seamless: Remove the word.
    powerful: Remove the word.
    utilize: Use "use".
    leverage: Use "use".
    various: Write each item.
