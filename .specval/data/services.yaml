# The service registry of specval itself. Each Go package is one or more
# services in the DPL layers. `package` is the Go package of the service.
# `calls` lists the services that the service calls today, from the Go imports.
#
# The code does not follow these layers yet. For example, the commands in
# internal/cli call accessors and the policy engine, which only a manager must
# do. specval reports such a call (SV202) when a spec changes the service. Each
# spec moves the code nearer to the layers. See plan.md.
services:
  # The commands. Each command is an entry point.
  CheckCommand: { layer: client, package: internal/cli, calls: [CheckManager] }
  ContextCommand: { layer: client, package: internal/cli, calls: [Baseline, ContextManager] }
  DoctorCommand: { layer: client, package: internal/cli, calls: [DoctorManager] }
  HookCommand: { layer: client, package: internal/cli, calls: [CheckManager, ClaudeHook] }
  InitCommand: { layer: client, package: internal/cli, calls: [ScaffoldManager] }
  NewCommand: { layer: client, package: internal/cli, calls: [ScaffoldManager] }
  SchemaCommand: { layer: client, package: internal/cli, calls: [Baseline] }

  CheckManager: { layer: manager, package: internal/check, calls: [ConfigAccessor, PolicyEngine] }
  ContextManager: { layer: manager, package: internal/describe, calls: [ConfigAccessor, PolicyEngine] }
  DoctorManager: { layer: manager, package: internal/doctor, calls: [ClaudeAccessor, ConfigAccessor, PolicyEngine] }
  ScaffoldManager: { layer: manager, package: internal/scaffold, calls: [Baseline, ClaudeAccessor, ConfigAccessor] }

  PolicyEngine: { layer: engine, package: internal/policy, calls: [Baseline, YamlPath] }

  # The settings file and the skill of Claude Code (internal/claude/settings.go).
  ClaudeAccessor: { layer: accessor, package: internal/claude, calls: [] }
  ConfigAccessor: { layer: accessor, package: internal/config, calls: [] }

  # The file system, and the process state: stdio, environment, and PATH.
  FileSystemResource: { layer: resource }
  ProcessResource: { layer: resource }

  # The hook protocol of Claude Code (internal/claude/hook.go). It decodes the
  # event and encodes the result. The caller gives the reader and the writer, so
  # it stores no data. Thus it is a utility, not an accessor.
  ClaudeHook: { layer: utility, package: internal/claude, may_call: [], calls: [] }
  # The schema, the layers, and the built-in rules. They are in the binary, so
  # the baseline reads no store and does no IO.
  Baseline: { layer: utility, package: internal/baseline, may_call: [], calls: [] }
  YamlPath: { layer: utility, package: internal/yamlpath, may_call: [], calls: [] }
