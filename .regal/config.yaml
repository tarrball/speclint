rules:
  idiomatic:
    directory-package-mismatch:
      # speclint finds rules by package name (speclint.spec.<name> and
      # speclint.registry.<name>), not by directory.
      level: ignore
    no-defined-entrypoint:
      # speclint queries the deny and warn rules of each package. It does not
      # use an entrypoint.
      level: ignore
  imports:
    unresolved-reference:
      level: error
      # speclint supplies this data at run time.
      except-paths:
        - data.dpl.*
        - data.project.*
        - data.project
